[server]
host = "127.0.0.1"
port = 3003

[binance]
base_url = "https://fapi.binance.com"
ws_url = "wss://fstream.binance.com"

[calculation]
# K线周期用于计算
kline_interval = "1h"
# 回溯天数（aggTrades 数据量大，建议 1-3 天）
lookback_days = 1
# 价格区间大小 (USDT)
price_bucket_size = 100.0
# 支持的交易对
symbols = ["BTCUSDT", "ETHUSDT"]
# 持仓留存率：成交量中留存为持仓的比例
# 调整此值来匹配 CoinAnk 的数据量级
retention_rate = 0.5

[leverage]
# 是否使用动态分布（基于爆仓数据学习）
# true = 启动爆仓数据收集器，从真实数据学习杠杆分布
use_dynamic = true

# 默认杠杆分布 (杠杆倍数 = 占比)
# 基于市场经验估算
[leverage.default_distribution]
lev_10 = 0.15
lev_20 = 0.35
lev_50 = 0.30
lev_100 = 0.15
lev_125 = 0.05

[storage]
db_path = "./data/liquidation.db"
# 数据保留时长（小时），超过此时长的数据会被定时清理
retention_hours = 30
